spring:
  application:
    name: CDC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9192}
    consumer:
      group-id: cdc-app
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

cdc:
  topics:
    # Topic = <topic.prefix>.<schema>.<table>
    order: cdc.order.public.order_entity

  # Debezium embedded engine properties, passed as-is to the engine.
  debezium:
    name: order-db-cdc
    connector.class: io.debezium.connector.postgresql.PostgresConnector
    database.hostname: ${DB_HOST:localhost}
    database.port: ${DB_PORT:5432}
    database.user: ${DB_USER:saga}
    database.password: ${DB_PASSWORD:saga}
    database.dbname: order_db
    topic.prefix: cdc.order
    table.include.list: public.order_entity,public.debezium_heartbeat
    plugin.name: pgoutput
    slot.name: cdc_order_slot
    publication.name: cdc_order_publication
    publication.autocreate.mode: filtered
    snapshot.mode: initial
    # Stored offset can lag the slot's confirmed LSN; without this the engine fails on start with
    # "no longer available on the server". Stream from the slot position instead.
    offset.mismatch.strategy: trust_slot
    decimal.handling.mode: string

    # Keep the slot advancing when order_entity is idle but other tables fill the WAL.
    # Table is created by sql/debezium_heartbeat.sql; its events are not published to Kafka.
    heartbeat.interval.ms: 10000
    heartbeat.action.query: >-
      INSERT INTO public.debezium_heartbeat (id, ts) VALUES (1, now())
      ON CONFLICT (id) DO UPDATE SET ts = EXCLUDED.ts

    # Offsets stored in a Kafka topic, so restarts resume from the last committed LSN.
    offset.storage: org.apache.kafka.connect.storage.KafkaOffsetBackingStore
    offset.storage.topic: cdc-app.debezium-offsets
    offset.storage.partitions: 1
    offset.storage.replication.factor: 1
    offset.flush.interval.ms: 5000
    bootstrap.servers: ${spring.kafka.bootstrap-servers}

    # Plain JSON (no schema envelope), row state flattened.
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    transforms: unwrap
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.add.fields: op,table,source.ts_ms
    transforms.unwrap.delete.tombstone.handling.mode: rewrite
